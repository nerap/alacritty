[ env ]
TERM = "xterm-256color"

[window]
padding.x = 12
padding.y = 12

decorations = "Buttonless"

[font]
normal.family = "Hack Nerd Font"
normal.style = "Regular"

#regular
size = 16

# Keyboard bindings
[[keyboard.bindings]]
key = "I"
mods = "Control"
chars = "\u001b[105;5u"

[general]
import = [
    "~/.config/alacritty/themes/themes/tokyo-night.toml"
]
